name = "vibodhsignalui"
main = "worker.mjs"
compatibility_date = "2024-09-23"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[send_email]]
name = "EMAIL"
remote = true

# Persistent feedback storage for both deployed form endpoints.
[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "vibodh-ui-feedback"
database_id = "e675d2a4-9966-4bdb-a75a-2a869daf47b7"
