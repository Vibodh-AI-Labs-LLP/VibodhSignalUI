name = "vibodhsignalui"
main = "worker.mjs"
compatibility_date = "2024-09-23"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[send_email]]
name = "EMAIL"
remote = true

# Local development uses this temporary D1 identifier. Before deployment,
# replace it with the real database ID returned by `wrangler d1 create`.
[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "vibodh-ui-feedback"
database_id = "00000000-0000-0000-0000-000000000000"
